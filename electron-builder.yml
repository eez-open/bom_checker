appId: hr.envox.eez.bomchecker
productName: EEZ BOM checker
executableName: eez-bom-checker
copyright: Copyright © 2026 EEZ - Envox Experimental Zone

directories:
  buildResources: build
  output: release

# Everything the app needs is bundled into out/ by electron-vite; production
# "dependencies" from package.json are added to the package automatically.
files:
  - out/**/*
  - package.json

win:
  target:
    - target: nsis
      arch: [x64]

nsis:
  artifactName: EEZ-BOM-checker-${version}-setup.${ext}
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true

linux:
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  artifactName: EEZ-BOM-checker-${version}-${arch}.${ext}
  category: Development
  synopsis: Check KiCad BOMs against DigiKey, Mouser and TME
  maintainer: Envox <eez@envox.hr>
  # Lets desktops match the running window to the menu entry.
  syncDesktopName: true

publish: null
