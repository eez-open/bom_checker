name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Lint, type check and unit tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check

  build:
    name: Build (${{ matrix.name }})
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            dist: dist:win
            executable: release/win-unpacked/eez-bom-checker.exe
            artifacts: release/*.exe
          # Oldest supported Ubuntu, so the build also runs on Ubuntu 22.04+
          # and Linux Mint 21+ (glibc compatibility).
          - name: Linux
            os: ubuntu-22.04
            dist: dist:linux
            executable: release/linux-unpacked/eez-bom-checker
            artifacts: |
              release/*.AppImage
              release/*.deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run ${{ matrix.dist }}
      - name: Smoke test the packaged app
        if: runner.os == 'Windows'
        run: npx playwright test
        env:
          E2E_APP_PATH: ${{ matrix.executable }}
      - name: Smoke test the packaged app
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum npx playwright test
        env:
          E2E_APP_PATH: ${{ matrix.executable }}
      - uses: actions/upload-artifact@v7
        with:
          name: installers-${{ matrix.name }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error

  release:
    name: Draft GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: installers
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: installers/*
          draft: true
