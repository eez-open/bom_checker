name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Lint, type check and unit tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check

  # A tag's installers go straight to its draft release. Kept as workflow
  # artifacts, every build's installers used up the Actions storage.
  draft:
    name: Draft GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - run: >-
          gh release view "$GITHUB_REF_NAME" ||
          gh release create "$GITHUB_REF_NAME" --draft
          --title "EEZ BOM checker ${GITHUB_REF_NAME#v}" --notes ""
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}

  build:
    name: Build (${{ matrix.name }})
    needs: [check, draft]
    # Also when draft is skipped, for branches and pull requests.
    if: ${{ !failure() && !cancelled() }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            dist: dist:win
            executable: release/win-unpacked/eez-bom-checker.exe
            installers: release/*.exe
          # Oldest supported Ubuntu, so the build also runs on Ubuntu 22.04+
          # and Linux Mint 21+ (glibc compatibility).
          - name: Linux
            os: ubuntu-22.04
            dist: dist:linux
            executable: release/linux-unpacked/eez-bom-checker
            installers: release/*.AppImage release/*.deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The token can write, for the release; the build needs no git
          # credentials.
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run ${{ matrix.dist }}
      - name: Smoke test the packaged app
        if: runner.os == 'Windows'
        run: npx playwright test
        env:
          E2E_APP_PATH: ${{ matrix.executable }}
      - name: Smoke test the packaged app
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum npx playwright test
        env:
          E2E_APP_PATH: ${{ matrix.executable }}
      - name: Attach the installers to the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: gh release upload "$GITHUB_REF_NAME" ${{ matrix.installers }} --clobber
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
